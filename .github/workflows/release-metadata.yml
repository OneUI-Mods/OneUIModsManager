name: Publish APK release metadata

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OneUI-Mods/OneUIModsManager
          ref: main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify the public APK and attach its metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/publish_release_metadata.py --repo "$RELEASE_REPO" --tag "$RELEASE_TAG"
